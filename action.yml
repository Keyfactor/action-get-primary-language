name: 'Get Primary Language'
description: 'Use the github api to derive the main detected language for the repository'
inputs:
  token:
    description: 'GH Token'
outputs:
  primary_language: 
    description: 'Detected primary language for the repository'
    value: ${{ steps.get_language.outputs.primary_language }}
runs:
  using: 'composite'
  steps:
    - run: bash ${{ github.action_path }}/src/get-primary-language.sh
      shell: bash
      id: get_language


branding:
  icon: 'flag'
  color: 'green'